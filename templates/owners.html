<div id="controller-wrapper" ng-controller="owners">
	<div class="input-modal" id="owner-input-modal" ng-class="{'visible-modal': modals.owner.visible}">
		<div class="cover" ng-click="modals.owner.visible = false"></div>
		<form novalidate>
			<i ng-click="modals.owner.visible = false" class="far fa-xmark"></i>
			<h4>Create owner</h4>
			<font color="red">[[errorHint]]</font>
			<div class="modal-form-group">
				<label for="name"><small>Owner name</small></label>
				<input type="text" id="name" placeholder="John Doe" ng-model="inputs.owner.name">
			</div>
			<div class="modal-form-group">
				<label for="login"><small>Login</small></label>
				<input type="text" id="login" placeholder="john" ng-model="inputs.owner.email">
			</div>
			<div class="modal-form-group">
				<label for="password"><small>Password</small></label>
				<input type="password" id="password" placeholder="******" ng-model="inputs.owner.password">
			</div>
			<div class="modal-form-group">
				<label for="cpassword"><small>Confirm password</small></label>
				<input type="password" id="cpassword" placeholder="******" ng-model="inputs.owner.cpassword" ng-class="{'error-input': inputs.owner.password != inputs.owner.cpassword}">
			</div>
			<div class="modal-form-group">
				<label for="country"><small>Country</small></label>
				<select id="country" ng-model="inputs.owner.country_id">
					<option ng-value="null">-</option>
					<option ng-repeat="country in relations.countries" ng-value="country.country_id">[[country.name]]</option>
				</select>
			</div>
			<div class="modal-form-group">
				<button ng-click="createOwner()">
					<span ng-hide="loading">Create</span>
					<i ng-show="loading" class="far fa-spinner-third fa-spin"></i>
				</button>
			</div>
		</form>
	</div>

	<section id="loading-screen" ng-if="loading">
		<div class="spinner-container">
			<span><i class="fas fa-spinner-third fa-spin"></i>&ensp;[[loadingHint]]...</span>
		</div>
	</section>
	<div class="sidebar">
		<h3><i class="far fa-gamepad-modern"></i>&ensp;iCafePlay Panel</h3>
		<ul ng-show="superuser.is_root">
			<li ng-repeat="menu in superMenus" ng-show="menu.is_root"><a href="#![[menu.route]]" ng-class="{'active-menu': menu.controller == controllerName}"><i class="[[menu.icon]]"></i>[[menu.name]]</a></li>
		</ul>
	</div>
	<div class="content">
		<nav>
			<h3><i class="fas fa-users-between-lines"></i>&ensp;Owners</h3>
			<div class="trailing">
				<span><i class="far fa-user"></i>&emsp;[[superuser.name]]</span>
				<button ng-click="logout(superuser)"><i class="far fa-power-off"></i>&emsp;Logout</button>
			</div>
		</nav>
		<section>
			<div class="meta-title">
				<h3>List of all owners</h3>
				<div class="trailing">
					<button ng-click="modals.owner.visible = true"><i class="far fa-plus"></i>&ensp;Owner</button>
				</div>
			</div>
			<table class="centered-table">
				<tr>
					<th width="200">ID</th>
					<th width="200">Name</th>
					<th width="200">Email</th>
					<th width="200">Active</th>
					<th width="200">Country</th>
				</tr>
				<tr ng-repeat="owner in owners | orderBy: '-user_id'">
					<td>[[owner.user_id]]</td>
					<td>[[owner.name]]</td>
					<td>[[owner.email]]</td>
					<td class="action-cell" ng-show="owner.is_active" ng-click="alterActivation(owner, false)"><i class="far fa-check"></i></td>
					<td class="action-cell" ng-hide="owner.is_active" ng-click="alterActivation(owner, true)"><i class="far fa-xmark"></i></td>
					<td>[[owner.country.name]]</td>
				</tr>
			</table>
		</section>
	</div>
</div>
