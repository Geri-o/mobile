<div id="login-panel" ng-controller="login">
	<form>
		<h2>Sing In</h2>
		<font color="red"><small>[[error]]</small></font>
		<input type="text" placeholder="+998" ng-model="phone">
		<input type="password" placeholder="*****" ng-model="password">
		<button ng-click="authorize()"><b>Login</b></button>
	</form>
</div>
